name: Status log

# Every 15 minutes: log any change in a creek's status on the live site. Commits only when something changed.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: archive-writes
  cancel-in-progress: false

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/status_watch.py
      - name: Commit if a status changed
        run: |
          git config user.name  "fews-archive-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add status
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Status change $(TZ=America/Los_Angeles date '+%Y-%m-%d %H:%M')"
          git pull --rebase --quiet
          git push
